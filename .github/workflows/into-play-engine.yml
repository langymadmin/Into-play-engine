# Build the headless engine once, here, so nobody has to build it again.
#
# Compiling Forge takes about fifteen minutes. Without this, every machine that
# wants to run the engine pays that: a dev container that gets wiped between
# sessions pays it every single time. This builds it on GitHub's runner and
# keeps the result, so afterwards everyone downloads instead of compiles.
#
# The same output is what gets shipped — to a server, or bundled into a tablet
# app — so this is the release build, not only a developer convenience.
#
# Only the engine modules are built. The desktop, Android and iOS front ends are
# not needed: into-play brings its own UI and talks to the engine over a socket.
name: Engine build

on:
  push:
    branches: [into-play]
    paths-ignore: ['**.md']
  workflow_dispatch:   # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven      # keeps the downloaded dependencies between runs

      - name: Build engine modules
        run: >
          mvn -B -q -pl forge-gui -am
          -DskipTests -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true
          install

      # One directory holding the four module jars and every dependency, so
      # running the engine is `java -cp 'engine/*' ...` with nothing to resolve.
      #
      # The dependencies are gathered from the local Maven repository by hand
      # rather than with dependency:copy-dependencies. That plugin cannot run
      # against a single module here: Forge's poms declare
      # <version>${revision}</version>, and resolving one module outside the
      # reactor has nothing to expand it with, so it dies on
      # "Could not find artifact forge:forge:pom:${revision}". The build above
      # has already put every dependency in ~/.m2, so take them from there —
      # the same approach run-spike.sh uses, for the same reason.
      - name: Collect the jars
        run: |
          set -euo pipefail
          mkdir -p engine

          for m in forge-core forge-game forge-ai forge-gui; do
            jar=$(ls "$m"/target/"$m"-*.jar 2>/dev/null | grep -v -e sources -e javadoc | head -1) || true
            [ -n "${jar:-}" ] || { echo "::error::$m was not built — expected $m/target/$m-*.jar"; exit 1; }
            cp "$jar" engine/
          done

          # Newest version of each third-party artifact. Two exclusions:
          # google-collections is the pre-Guava library with the same package
          # names and silently shadows Guava (you find out much later, via a
          # NoSuchMethodError from somewhere unrelated); and the -android Guava
          # variant would compete with the -jre one.
          find ~/.m2/repository -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' \
            | sed "s|^$HOME/.m2/repository/||" \
            | awk -F/ '{ ver=$(NF-1); base=""; for(i=1;i<=NF-2;i++) base=base $i "/"; print base "\t" ver "\t" $0 }' \
            | sort -t$'\t' -k1,1 -k2,2V \
            | awk -F'\t' '{ a[$1]=$3 } END { for (k in a) print a[k] }' \
            | grep -vE 'google-collections|guava-.*-android|forge-' \
            | while read -r rel; do cp "$HOME/.m2/repository/$rel" engine/; done

          echo "jars: $(ls engine | wc -l), size: $(du -sh engine | cut -f1)"

      - name: Smoke test — does the engine still start a game?
        run: |
          javac -cp "engine/*" -d engine into-play/*.java
          timeout 300 java -cp "engine/*:engine" Spike forge-gui/res | tee spike.log
          grep -q "coin toss" spike.log || {
            echo "::error::engine did not reach the coin toss — the headless path is broken"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: into-play-engine
          path: engine/
          retention-days: 30
