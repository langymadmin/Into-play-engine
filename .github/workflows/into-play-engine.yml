# Build the headless engine once, here, so nobody has to build it again.
#
# Compiling Forge takes about fifteen minutes. Without this, every machine that
# wants to run the engine pays that: a dev container that gets wiped between
# sessions pays it every single time. This builds it on GitHub's runner and
# keeps the result, so afterwards everyone downloads instead of compiles.
#
# The same output is what gets shipped — to a server, or bundled into a tablet
# app — so this is the release build, not only a developer convenience.
#
# Only the engine modules are built. The desktop, Android and iOS front ends are
# not needed: into-play brings its own UI and talks to the engine over a socket.
name: Engine build

on:
  push:
    branches: [into-play]
    paths-ignore: ['**.md']
  workflow_dispatch:   # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven      # keeps the downloaded dependencies between runs

      - name: Build engine modules
        run: >
          mvn -B -q -pl forge-gui -am
          -DskipTests -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true
          install

      # One directory holding the four module jars and every dependency, so
      # running the engine is `java -cp 'engine/*' ...` with nothing to resolve.
      #
      # The dependencies are gathered from the local Maven repository by hand
      # rather than with dependency:copy-dependencies. That plugin cannot run
      # against a single module here: Forge's poms declare
      # <version>${revision}</version>, and resolving one module outside the
      # reactor has nothing to expand it with, so it dies on
      # "Could not find artifact forge:forge:pom:${revision}". The build above
      # has already put every dependency in ~/.m2, so take them from there —
      # the same approach run-spike.sh uses, for the same reason.
      - name: Collect the jars
        run: |
          set -euo pipefail
          mkdir -p engine

          for m in forge-core forge-game forge-ai forge-gui; do
            jar=$(ls "$m"/target/"$m"-*.jar 2>/dev/null | grep -v -e sources -e javadoc | head -1) || true
            [ -n "${jar:-}" ] || { echo "::error::$m was not built — expected $m/target/$m-*.jar"; exit 1; }
            cp "$jar" engine/
          done

          # Newest version of each third-party artifact. Two exclusions:
          # google-collections is the pre-Guava library with the same package
          # names and silently shadows Guava (you find out much later, via a
          # NoSuchMethodError from somewhere unrelated); and the -android Guava
          # variant would compete with the -jre one.
          find ~/.m2/repository -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' \
            | sed "s|^$HOME/.m2/repository/||" \
            | awk -F/ '{ ver=$(NF-1); base=""; for(i=1;i<=NF-2;i++) base=base $i "/"; print base "\t" ver "\t" $0 }' \
            | sort -t$'\t' -k1,1 -k2,2V \
            | awk -F'\t' '{ a[$1]=$3 } END { for (k in a) print a[k] }' \
            | grep -vE 'google-collections|guava-.*-android|forge-' \
            | while read -r rel; do cp "$HOME/.m2/repository/$rel" engine/; done

          echo "jars: $(ls engine | wc -l), size: $(du -sh engine | cut -f1)"

      - name: Smoke test — does the engine still start a game?
        run: |
          javac -cp "engine/*" -d engine into-play/*.java
          timeout 300 java -cp "engine/*:engine" Spike forge-gui/res | tee spike.log
          grep -q "coin toss" spike.log || {
            echo "::error::engine did not reach the coin toss — the headless path is broken"
            exit 1
          }

      # The fork's reason to exist. PhantomSpike exits non-zero on any failed
      # check, so an upstream merge that quietly closes the hole — by tightening
      # canTarget(), or by reworking the TargetChoices whitelist we patched —
      # fails here instead of being discovered in a game.
      - name: Can a spell still be aimed at something the engine cannot see?
        run: timeout 300 java -cp "engine/*:engine" PhantomSpike forge-gui/res

      # The bridge, driven by a WebSocket client that presses OK through every
      # phase and taps a card whenever the engine wants one. It has to play a
      # game to the end, which is a stronger claim than it sounds: three threads
      # — engine, socket, client — hand control to each other hundreds of times,
      # and a deadlock anywhere stops the game quietly rather than failing.
      - name: Can a whole game be played over the socket?
        run: |
          javac -cp "engine/*" -d engine into-play/src/forge/intoplay/*.java
          java -Xmx2g -cp "engine/*:engine" forge.intoplay.BridgeMain forge-gui/res 8099 \
            > bridge-server.log 2>&1 &
          SERVER=$!
          # Loading 34k card scripts takes a few seconds, so wait for the socket
          # rather than guessing at a sleep. Without the card database the engine
          # gets as far as the coin toss and then NPEs while dealing opening
          # hands, which looks like a broken bridge and is not one.
          for _ in $(seq 1 90); do
            grep -q "bridge listening" bridge-server.log && break
            sleep 1
          done
          grep -q "bridge listening" bridge-server.log || {
            echo "::error::the bridge never came up"
            grep -v "not assigned to any set" bridge-server.log | tail -20
            exit 1
          }
          node into-play/bridge-client.mjs ws://localhost:8099/play 60 || {
            echo "::error::a game could not be played over the bridge"
            grep -v "not assigned to any set" bridge-server.log | tail -30
            kill $SERVER 2>/dev/null || true
            exit 1
          }
          kill $SERVER 2>/dev/null || true

      # The one card, end to end, and the reason the fork exists: Lightning
      # Bolt aimed at a creature the engine cannot see. It is a separate step
      # from the game above because it asserts something different — not that a
      # game runs, but that a spell with no legal target in the engine's state
      # can still be cast, paid for, resolved, and reported to the room.
      - name: Can Bolt be aimed at something that is not in the game?
        run: |
          java -Xmx2g -cp "engine/*:engine" forge.intoplay.BridgeMain forge-gui/res 8100 \
            > bolt-server.log 2>&1 &
          SERVER=$!
          for _ in $(seq 1 90); do
            grep -q "bridge listening" bolt-server.log && break
            sleep 1
          done
          grep -q "bridge listening" bolt-server.log || {
            echo "::error::the bridge never came up"
            grep -v "not assigned to any set" bolt-server.log | tail -20
            exit 1
          }
          node into-play/bolt-client.mjs ws://localhost:8100/play 45 || {
            echo "::error::Bolt could not be aimed off the table"
            grep -v "not assigned to any set" bolt-server.log | tail -30
            kill $SERVER 2>/dev/null || true
            exit 1
          }
          kill $SERVER 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: into-play-engine
          path: engine/
          retention-days: 30
